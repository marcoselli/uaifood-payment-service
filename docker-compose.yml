version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: uaifood-payment-postgres
    environment:
      POSTGRES_DB: uaifood_payment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uaifood-network

  mongodb:
    image: mongo:6
    container_name: uaifood-payment-mongodb
    environment:
      MONGO_INITDB_DATABASE: uaifood_payment
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uaifood-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: uaifood-payment-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uaifood-network

  payment-service:
    build: .
    container_name: uaifood-payment-service
    depends_on:
      - postgres
      - mongodb
      - rabbitmq
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/uaifood_payment
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_DATA_MONGODB_URI=mongodb://root:root@mongodb:27017/uaifood_payment?authSource=admin
    networks:
      - uaifood-network

volumes:
  postgres_data:
  rabbitmq_data:
  mongodb_data:

networks:
  uaifood-network:
    driver: bridge 