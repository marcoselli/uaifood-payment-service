name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: payment_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build with Gradle
      run: ./gradlew build
    
    - name: Run tests with coverage
      run: ./gradlew jacocoTestReport
    
    - name: Check test coverage
      run: |
        COVERAGE=$(grep -oP 'Total.*?(\d+\.\d+)%' build/reports/jacoco/test/html/index.html | grep -oP '\d+\.\d+')
        if (( $(echo "$COVERAGE < 80" | bc -l) )); then
          echo "Test coverage ($COVERAGE%) is below the required 80%"
          exit 1
        fi
    
    - name: Upload test coverage report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: build/reports/jacoco/test/html/
    
    - name: Run SonarQube analysis
      uses: SonarSource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      with:
        args: >
          -Dsonar.projectKey=uaifood-payment-service
          -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
          -Dsonar.coverage.exclusions=**/config/**,**/dto/**,**/exception/**,**/model/**
          -Dsonar.test.inclusions=**/*Test.kt,**/*Steps.kt
          -Dsonar.java.binaries=build/classes/kotlin/main
          -Dsonar.kotlin.detekt.reportPaths=build/reports/detekt/detekt.xml
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.minimumCoverage=70 