spring:
  application:
    name: uaifood-payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/uaifood_payment
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8082

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:TEST-ACCESS-TOKEN}
  public-key: ${MERCADOPAGO_PUBLIC_KEY:TEST-PUBLIC-KEY}
  client-id: ${MERCADOPAGO_CLIENT_ID:TEST-CLIENT-ID}
  client-secret: ${MERCADOPAGO_CLIENT_SECRET:TEST-CLIENT-SECRET}
  webhook:
    secret: ${MERCADOPAGO_WEBHOOK_SECRET:TEST-WEBHOOK-SECRET}
  success-url: ${PAYMENT_SUCCESS_URL:http://localhost:3000/payment/success}
  failure-url: ${PAYMENT_FAILURE_URL:http://localhost:3000/payment/failure}
  pending-url: ${PAYMENT_PENDING_URL:http://localhost:3000/payment/pending}

payment:
  mock:
    enabled: ${PAYMENT_MOCK_ENABLED:false}  # Enable mocks by setting PAYMENT_MOCK_ENABLED=true 